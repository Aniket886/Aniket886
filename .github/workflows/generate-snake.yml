name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: Aniket886
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%238b5cf6&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216139
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23a855f7&color_dots=%23161b22,%230e4429,%2300651d,%2326a641,%2339d353

      - name: Commit generated files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake changes to commit"
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git push origin HEAD:main
