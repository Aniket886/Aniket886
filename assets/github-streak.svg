<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  style="isolation:isolate" viewBox="0 0 495 195" width="495px" height="195px">
  <defs>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9500"/>
      <stop offset="0.55" stop-color="#FF5A00"/>
      <stop offset="1" stop-color="#E01E00"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#FF7A00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
      .flicker2 { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite reverse; }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      @keyframes flicker { 0%,100% { transform: scale(1,1) skewX(0deg); } 30% { transform: scale(1.03,0.96) skewX(-2deg); } 60% { transform: scale(0.97,1.05) skewX(2deg); } }
      @keyframes glow { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="194" fill="#151515" stroke="#555555" rx="3.5"/>

  <!-- Section dividers -->
  <line x1="165" y1="27" x2="165" y2="170" stroke="#8A8A8A" stroke-width="1.5"/>
  <line x1="330" y1="27" x2="330" y2="170" stroke="#8A8A8A" stroke-width="1.5"/>

  <!-- LEFT: Total Contributions -->
  <g transform="translate(82.5,80)">
    <text y="0" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="29" font-weight="700">9632</text>
    <text y="36" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14">Total Contributions</text>
    <text y="67" text-anchor="middle" fill="#A8A8A8"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="12">Jan 1, 2026 - Nov 11, 2026</text>
  </g>

  <!-- CENTER: Current Streak -->
  <g transform="translate(247.5,75)">
    <ellipse class="glow" cx="0" cy="-6" rx="58" ry="52" fill="url(#flameGlow)"/>
    <g transform="translate(0,-4) scale(1.1)">
      <path class="flicker" fill="url(#flameOuter)" d="M2-58C8-44 24-36 30-18C35-3 33 18 22 30C14 38 7 41 0 41C-7 41-14 38-22 30C-33 18-35-3-29-18C-26-26-20-31-17-40C-12-32-10-27-8-22C-9-36-5-48 2-58Z"/>
      <path class="flicker2" fill="url(#flameMid)" d="M1-38C6-28 18-21 21-8C24 5 21 18 13 26C9 30 4 32 0 32C-4 32-9 30-13 26C-21 18-24 5-20-8C-17-17-11-22-7-29C-5-23-3-19-2-15C-3-25 0-32 1-38Z"/>
      <path fill="#FFF3C4" opacity="0.9" d="M0-14C5-7 13-1 13 10C13 20 7 27 0 27C-7 27-13 20-13 10C-13 1-6-5 0-14Z"/>
    </g>
    <text y="18" text-anchor="middle" fill="#151515"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="28" font-weight="800">223</text>
    <text y="62" text-anchor="middle" fill="#FF9500"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" font-weight="600">Current Streak</text>
    <text y="88" text-anchor="middle" fill="#A8A8A8"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="12">Apr 3 - Nov 11, 2026</text>
  </g>

  <!-- RIGHT: Longest Streak -->
  <g transform="translate(412.5,80)">
    <text y="0" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="29" font-weight="700">223</text>
    <text y="36" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14">Longest Streak</text>
    <text y="67" text-anchor="middle" fill="#A8A8A8"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="12">Apr 3 - Nov 11, 2026</text>
  </g>
</svg>