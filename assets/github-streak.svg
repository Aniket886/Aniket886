<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  style="isolation:isolate" viewBox="0 0 495 195" width="495px" height="195px">
  <rect width="495" height="195" fill="#0D1117" rx="4.5"/>

  <!-- Section dividers -->
  <line x1="165" y1="28" x2="165" y2="167" stroke="#30363D" stroke-width="1"/>
  <line x1="330" y1="28" x2="330" y2="167" stroke="#30363D" stroke-width="1"/>

  <!-- Total Contributions -->
  <g transform="translate(82.5,97)">
    <text y="-45" text-anchor="middle" fill="#8B949E"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="11">Jan 1, 2026 – Apr 28, 2026</text>
    <text y="8" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="32" font-weight="700">6259</text>
    <text y="32" text-anchor="middle" fill="#C9D1D9"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14">Total Contributions</text>
  </g>

  <!-- Current Streak -->
  <g transform="translate(247.5,97)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#E8570A" stroke-width="5"/>
    <!-- flame emoji stand-in -->
    <text y="-52" text-anchor="middle" fill="#8B949E"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="10">Apr 3, 2026 – Apr 28, 2026</text>
    <text y="10" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="28" font-weight="700">26</text>
    <text y="28" text-anchor="middle" fill="#8B949E"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="11">days</text>
    <text y="62" text-anchor="middle" fill="#E8570A"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14" font-weight="600">Current Streak</text>
  </g>

  <!-- Longest Streak -->
  <g transform="translate(412.5,97)">
    <text y="-45" text-anchor="middle" fill="#8B949E"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="11">Apr 3, 2026 – Apr 28, 2026</text>
    <text y="8" text-anchor="middle" fill="#FFFFFF"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="32" font-weight="700">26</text>
    <text y="32" text-anchor="middle" fill="#C9D1D9"
      font-family="Segoe UI,Ubuntu,sans-serif" font-size="14">Longest Streak</text>
  </g>
</svg>