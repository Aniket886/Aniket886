<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Cyber builder scene</title>
  <desc id="desc">Animated cyber workspace illustration with dual monitors, terminal glow, and a relaxed builder silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.22 0 1 0 0 0.74 0 0 1 0 0.97 0 0 0 0.9 0"/>
    </filter>
    <style>
      .float { animation: float 5.2s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1, end) infinite; }
      .scan { animation: scan 3.8s linear infinite; }
      .line { animation: pulse 2.8s ease-in-out infinite; }
      .line2 { animation-delay: .35s; }
      .line3 { animation-delay: .7s; }
      .line4 { animation-delay: 1.05s; }
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.2; } }
      @keyframes scan { 0% { transform: translateY(-130px); } 100% { transform: translateY(420px); } }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="520" rx="30" fill="url(#bg)"/>
  <rect x="30" y="30" width="840" height="460" rx="24" fill="url(#glow)" stroke="#1f2937"/>

  <ellipse cx="450" cy="420" rx="250" ry="60" fill="#0b1220" opacity="0.9"/>
  <path d="M110 355h560v18H110z" fill="#374151"/>
  <path d="M120 348h540v10H120z" fill="#111827"/>

  <g class="float">
    <rect x="110" y="145" width="156" height="164" rx="10" fill="url(#screen)" stroke="#6b7280" stroke-width="5"/>
    <rect x="134" y="168" width="108" height="116" rx="7" fill="#07111f" stroke="#0ea5e9" stroke-width="2"/>
    <g transform="translate(146 180)">
      <rect width="84" height="8" rx="4" fill="#0f766e" class="line"/>
      <rect y="18" width="64" height="8" rx="4" fill="#7ee787" class="line line2"/>
      <rect y="36" width="78" height="8" rx="4" fill="#38bdf8" class="line line3"/>
      <rect y="54" width="50" height="8" rx="4" fill="#a855f7" class="line line4"/>
      <rect y="72" width="68" height="8" rx="4" fill="#22c55e" class="line"/>
    </g>
    <rect x="165" y="309" width="42" height="10" rx="5" fill="#6b7280"/>
    <rect x="130" y="319" width="112" height="8" rx="4" fill="#9ca3af"/>
  </g>

  <g class="float" style="animation-delay:-1.6s">
    <rect x="260" y="120" width="204" height="180" rx="12" fill="url(#screen)" stroke="#94a3b8" stroke-width="5"/>
    <rect x="286" y="145" width="152" height="132" rx="8" fill="#07111f" stroke="#38bdf8" stroke-width="2"/>
    <path d="M300 252 L342 216 L375 226 L408 190 L424 198" fill="none" stroke="#7ee787" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="252" r="4" fill="#7ee787"/>
    <circle cx="342" cy="216" r="4" fill="#38bdf8"/>
    <circle cx="375" cy="226" r="4" fill="#7ee787"/>
    <circle cx="408" cy="190" r="4" fill="#a855f7"/>
    <circle cx="424" cy="198" r="4" fill="#7ee787"/>
    <rect x="338" y="302" width="56" height="10" rx="5" fill="#6b7280"/>
    <rect x="312" y="312" width="108" height="8" rx="4" fill="#9ca3af"/>
  </g>

  <g transform="translate(470 124)">
    <path d="M28 72c0-18 14-32 31-32s31 14 31 32v76H28z" fill="#1f2937"/>
    <path d="M12 96c0-18 12-36 23-36h10l16 28 16-28h10c13 0 24 18 24 36v90H12z" fill="#111827"/>
    <path d="M41 50c0-10 8-18 18-18s18 8 18 18-8 18-18 18-18-8-18-18z" fill="#0f172a"/>
    <circle cx="57" cy="50" r="7" fill="#38bdf8"/>
    <path d="M16 147c18 14 40 16 76 16h22v-24c0-16-10-28-22-28H37c-11 0-21 10-21 23z" fill="#0f172a"/>
    <path d="M28 88c18 10 34 12 51 12 15 0 28-4 44-12l18 32v55H12v-56z" fill="#1f2937"/>
    <path d="M54 74l20 2 7 16-18 14-20-11z" fill="#facc15"/>
    <path d="M46 73l38 7-4 15-35-6z" fill="#374151"/>
    <path d="M95 63l16 12-10 16-17-10z" fill="#94a3b8"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.9">
    <circle cx="690" cy="95" r="42" fill="#38bdf8"/>
    <circle cx="690" cy="95" r="20" fill="#0d1117"/>
    <path d="M682 68c9 0 13 7 13 13 0 4-2 8-4 10 5 2 8 7 8 12 0 10-8 18-18 18s-18-8-18-18c0-6 3-10 8-12-2-2-4-6-4-10 0-6 4-13 13-13z" fill="#7ee787"/>
  </g>

  <rect x="78" y="60" width="744" height="4" fill="#1f2937"/>
  <g class="scan" opacity="0.18">
    <rect x="78" y="60" width="744" height="54" fill="#38bdf8"/>
  </g>

  <g opacity="0.92">
    <path d="M510 388h42c11 0 20-9 20-20v-22h-82v22c0 11 9 20 20 20z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="501" y="362" width="60" height="9" rx="4.5" fill="#7ee787"/>
    <rect x="572" y="348" width="28" height="82" rx="14" fill="#334155"/>
    <rect x="590" y="365" width="108" height="16" rx="8" fill="#1f2937"/>
    <rect x="690" y="352" width="54" height="16" rx="8" fill="#7ee787"/>
    <rect x="729" y="335" width="38" height="42" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
